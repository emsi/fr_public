name: Native Linux

on:
  push:
    branches: [native-linux]
    paths:
      - 'werkkzeug3/native/**'
      - 'werkkzeug3/werkops.cpp'
      - 'werkkzeug3/data/theta/**'
      - '.github/workflows/native-linux.yml'
  pull_request:
    paths:
      - 'werkkzeug3/native/**'
      - 'werkkzeug3/werkops.cpp'
      - 'werkkzeug3/data/theta/**'
      - '.github/workflows/native-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            build_type: Release
            sanitize: 'OFF'
            graphics: 'ON'
          - compiler: clang++
            build_type: Debug
            sanitize: 'ON'
            graphics: 'OFF'
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Install build and Mesa dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build clang pkg-config libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri
      - name: Configure
        run: >-
          cmake -S werkkzeug3/native -B build/native -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DWZ3_SANITIZE=${{ matrix.sanitize }}
          -DWZ3_BUILD_RENDERER=${{ matrix.graphics }}
          -DWZ3_TEST_GRAPHICS=${{ matrix.graphics }}
      - name: Build
        run: cmake --build build/native --parallel 2
      - name: Test project loading, graph reconstruction and textures
        run: ctest --test-dir build/native --output-on-failure
